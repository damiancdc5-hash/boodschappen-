name: App publiceren (GitHub Pages)
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/deploy.yml']
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Supabase-gegevens invullen
        if: ${{ vars.SUPABASE_URL != '' }}
        run: |
          sed -i "s|export const SUPABASE_URL = '';|export const SUPABASE_URL = '${{ vars.SUPABASE_URL }}';|" app/js/config.js
          sed -i "s|export const SUPABASE_ANON_KEY = '';|export const SUPABASE_ANON_KEY = '${{ vars.SUPABASE_ANON_KEY }}';|" app/js/config.js
          sed -i "s|const VERSION = 'v1';|const VERSION = '${{ github.sha }}';|" app/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
