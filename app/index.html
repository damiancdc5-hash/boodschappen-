<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Boodschappenassistent</title>
  <meta name="description" content="Slimme boodschappenassistent voor het hele huishouden">
  <meta name="theme-color" content="#1f8a5b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Boodschappen">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <aside id="sidenav" class="sidenav" aria-label="Hoofdmenu"></aside>
    <div class="main-col">
      <header class="topbar">
        <button id="hh-switch" class="hh-switch" aria-label="Huishouden"></button>
        <div id="sync-dot" class="sync-dot" title="Synchronisatie"></div>
      </header>
      <div id="banner"></div>
      <main id="view" tabindex="-1"><div class="loading"><span class="spinner"></span>Laden…</div></main>
    </div>
    <nav id="bottomnav" class="bottomnav" aria-label="Snelmenu"></nav>
  </div>
  <noscript>Deze app heeft JavaScript nodig.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
